name: Build and publish Faction Overhaul

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "source/READY"
      - ".github/workflows/build-publish.yml"

permissions:
  contents: write

concurrency:
  group: faction-overhaul-publish
  cancel-in-progress: false

jobs:
  build-publish:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout update repository
        uses: actions/checkout@v4

      - name: Reconstruct source archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $b64 = (Get-Content "source/FactionOverhaul-core-source.b64" -Raw) -replace "\\s", ""
          [IO.File]::WriteAllBytes("FactionOverhaul-core-source.zip", [Convert]::FromBase64String($b64))
          $expected = (Get-Content "source/source.sha256" -Raw).Trim().ToLowerInvariant()
          $actual = (Get-FileHash "FactionOverhaul-core-source.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Source archive SHA256 mismatch: expected $expected, got $actual" }
          Expand-Archive "FactionOverhaul-core-source.zip" -DestinationPath "project" -Force
          New-Item -ItemType Directory -Path "project/assets" -Force | Out-Null

      - name: Pin launcher update channel to GitHub
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $old = "https://updates.xntservers.com/faction-overhaul/update.json"
          $new = "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/main/update.json"
          $files = Get-ChildItem "project" -Recurse -File | Where-Object { $_.Extension -in ".cpp",".h",".json",".md" }
          $replaced = 0
          foreach ($file in $files) {
            $content = Get-Content $file.FullName -Raw
            if ($content -and $content.Contains($old)) {
              $content = $content.Replace($old, $new)
              Set-Content $file.FullName $content -Encoding UTF8 -NoNewline
              $replaced++
            }
          }
          if ($replaced -lt 1) { throw "Legacy XNT update endpoint was not found in reconstructed source." }
          $versionPath = "project/version.json"
          $version = Get-Content $versionPath -Raw | ConvertFrom-Json
          $version.launcherVersion = "1.2.2"
          $version | ConvertTo-Json -Depth 8 | Set-Content $versionPath -Encoding UTF8
          Write-Host "Pinned GitHub update channel in $replaced file(s); launcher version set to 1.2.1."

      - name: Restore pinned third-party dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path "project/third_party" -Force | Out-Null
          git clone --depth 1 --branch v1.91.8 https://github.com/ocornut/imgui.git project/third_party/imgui
          git clone --depth 1 --branch v1.3.4 https://github.com/TsudaKageyu/minhook.git project/third_party/minhook
          New-Item -ItemType Directory -Path "project/third_party/json" -Force | Out-Null
          Invoke-WebRequest "https://raw.githubusercontent.com/nlohmann/json/v3.11.3/single_include/nlohmann/json.hpp" -OutFile "project/third_party/json/json.hpp"

      - name: Apply pinned ImGui Win32 compatibility declaration
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $path = "project/src/Launcher/main.cpp"
          $src = Get-Content $path -Raw
          if ($src -notmatch "ImGui_ImplWin32_WndProcHandler") { throw "Expected ImGui handler reference not found." }
          if ($src -notmatch "extern IMGUI_IMPL_API LRESULT ImGui_ImplWin32_WndProcHandler") {
            $decl = "#include <Windows.h>" + [Environment]::NewLine + "extern LRESULT ImGui_ImplWin32_WndProcHandler(HWND hWnd, UINT msg, WPARAM wParam, LPARAM lParam);" + [Environment]::NewLine
            $src = $decl + $src
            Set-Content $path $src -Encoding UTF8 -NoNewline
          }

      - name: Export launcher maintenance sources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "maintenance-source" | Out-Null
          Copy-Item "project/src/Launcher/self_update_service.cpp" "maintenance-source/self_update_service.cpp" -Force
          Copy-Item "project/src/Launcher/updater_main.cpp" "maintenance-source/updater_main.cpp" -Force
          Copy-Item "project/src/Launcher/self_update_service.h" "maintenance-source/self_update_service.h" -Force

      - name: Configure Win32
        shell: pwsh
        run: |
          cmake -S project -B project/build -A Win32 "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" -DBUILD_TESTING=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build launcher and runtime
        shell: pwsh
        run: |
          cmake --build project/build --config Release --target AC4FactionOverhaul AC4FactionOverhaulInjector FactionOverhaulLauncher FactionOverhaulUpdater --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package launcher and runtime
        shell: pwsh
        run: |
          $v = Get-Content "project/version.json" -Raw | ConvertFrom-Json
          $base = "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/main/releases"
          & "project/tools/PUBLISH_ALL.ps1" -ModVersion ([string]$v.modVersion) -LauncherVersion ([string]$v.launcherVersion) -BaseUrl $base -OutputDir "../release-out" -ModNotes "Automatic Faction Overhaul runtime update" -LauncherNotes "Launcher 1.2.2: updater is bundled with the launcher; GitHub stable update channel retained; visual assets are bundled when present"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Complete launcher package assets and updater
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $v = Get-Content "project/version.json" -Raw | ConvertFrom-Json
          $zip = Get-ChildItem "release-out/FactionOverhaulLauncher-*.zip" | Select-Object -First 1
          if (-not $zip) { throw "Launcher package missing before completion step." }
          $stage = Join-Path $env:RUNNER_TEMP "launcher-package"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $zip.FullName -DestinationPath $stage -Force

          $updater = Get-ChildItem "project/build" -Recurse -Filter "FactionOverhaulUpdater.exe" | Where-Object { $_.FullName -match "Release" } | Select-Object -First 1
          if (-not $updater) { throw "Built FactionOverhaulUpdater.exe not found." }
          Copy-Item $updater.FullName (Join-Path $stage "FactionOverhaulUpdater.exe") -Force

          $launcher = Get-ChildItem "project/build" -Recurse -Filter "FactionOverhaulLauncher.exe" | Where-Object { $_.FullName -match "Release" } | Select-Object -First 1
          if (-not $launcher) { throw "Built FactionOverhaulLauncher.exe not found." }
          Copy-Item $launcher.FullName (Join-Path $stage "FactionOverhaulLauncher.exe") -Force

          if (Test-Path "project/assets") {
            $assetFiles = Get-ChildItem "project/assets" -Recurse -File
            if ($assetFiles.Count -gt 0) {
              New-Item -ItemType Directory -Path (Join-Path $stage "assets") -Force | Out-Null
              Copy-Item "project/assets/*" (Join-Path $stage "assets") -Recurse -Force
              Write-Host "Bundled $($assetFiles.Count) visual asset file(s)."
            } else {
              Write-Warning "project/assets exists but is empty; launcher will use its compiled fallback visuals."
            }
          }

          Remove-Item $zip.FullName -Force
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zip.FullName -CompressionLevel Optimal
          $updaterInZip = Join-Path $stage "FactionOverhaulUpdater.exe"
          if (-not (Test-Path $updaterInZip)) { throw "Updater packaging verification failed." }
          Write-Host "Launcher package completed with updater and available assets."

          # Repacking changes the launcher archive hash; keep update.json coherent before validation.
          $manifestPath = "release-out/update.json"
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $manifest.launcher.sha256 = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest.launcher.packageUrl = "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/main/releases/$($zip.Name)"
          $manifest | ConvertTo-Json -Depth 8 | Set-Content $manifestPath -Encoding UTF8
          Write-Host "Refreshed launcher SHA-256 in update.json after package completion."

      - name: Validate generated release
        shell: pwsh
        run: |
          & "./tools/Validate-Release.ps1" -ReleaseOut "release-out" -VersionFile "project/version.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish generated update channel
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path "releases" -Force | Out-Null
          Copy-Item "release-out/FactionOverhaulLauncher-*.zip" "releases/" -Force
          Copy-Item "release-out/FactionOverhaulRuntime-*.zip" "releases/" -Force
          Copy-Item "release-out/update.json" "update.json" -Force

          $validation = Get-Content "release-out/validation.json" -Raw | ConvertFrom-Json
          New-Item -ItemType Directory -Path "changelogs" -Force | Out-Null
          @(
            "AC4 Faction Overhaul release",
            "Launcher: $($validation.launcherVersion)",
            "Runtime: $($validation.modVersion)",
            "Launcher archive: $($validation.launcherFile)",
            "Launcher SHA-256: $($validation.launcherSha256)",
            "Runtime archive: $($validation.runtimeFile)",
            "Runtime SHA-256: $($validation.runtimeSha256)",
            "Validation: PASS (package count, versions, filenames, SHA-256 and update.json coherence)",
            "Build: GitHub Actions windows-latest / Release / Win32",
            "Launcher fix: FactionOverhaulUpdater.exe is now mandatory in the launcher package; available visual assets are copied into the package; GitHub stable update channel retained.",
            "Known limitation: existing launcher 1.1.0 installations without the updater require one manual launcher package replacement. In-game behavior still requires AC4 playtest."
          ) | Set-Content "changelogs/launcher-$($validation.launcherVersion)_runtime-$($validation.modVersion).txt" -Encoding UTF8

          $v = Get-Content "project/version.json" -Raw | ConvertFrom-Json
          @(
            "launcherVersion=$($v.launcherVersion)",
            "modVersion=$($v.modVersion)",
            "sourceSha256=$((Get-Content 'source/source.sha256' -Raw).Trim())",
            "builtUtc=$([DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ'))"
          ) | Set-Content "releases/latest.txt" -Encoding UTF8

          git config user.name "Faction Overhaul Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add update.json releases changelogs maintenance-source
          if (git diff --cached --quiet) {
            Write-Host "No generated release changes."
            exit 0
          }
          git commit -m "Publish launcher $($v.launcherVersion) / runtime $($v.modVersion)"
          git push
