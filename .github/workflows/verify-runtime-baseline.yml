name: Verify AC4 runtime baseline (research only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/**"
      - ".github/workflows/verify-runtime-baseline.yml"

permissions:
  contents: read

jobs:
  runtime-baseline:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify and reconstruct archived sources
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $b64 = (Get-Content "source/FactionOverhaul-core-source.b64" -Raw) -replace '\s', ''
          [IO.File]::WriteAllBytes("core-source.zip", [Convert]::FromBase64String($b64))
          $expected = (Get-Content "source/source.sha256" -Raw).Trim().ToLowerInvariant()
          $actual = (Get-FileHash "core-source.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Source archive hash mismatch" }
          Expand-Archive "core-source.zip" -DestinationPath "project" -Force
          if (-not (Test-Path "project/src/Debug/runtime_inspector.cpp")) { throw "Missing runtime inspector" }
          # Compare the archived bytes with the tracked Git blob. Windows checkout
          # may convert line endings in the maintenance export (CRLF vs LF).
          $original = (git hash-object --no-filters "project/src/Debug/runtime_inspector.cpp").Trim()
          if ($LASTEXITCODE -ne 0) { throw "Cannot hash archived runtime inspector" }
          $export = (git rev-parse "HEAD:maintenance-source/src_Debug_runtime_inspector.cpp").Trim()
          if ($LASTEXITCODE -ne 0) { throw "Cannot resolve tracked maintenance inspector" }
          if ($original -ne $export) { throw "Archived runtime inspector Git blob mismatch" }
          Write-Host "Verified archived runtime inspector Git blob: $original"
      - name: Restore pinned dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path "project/third_party" -Force | Out-Null
          git clone --depth 1 --branch v1.91.8 https://github.com/ocornut/imgui.git project/third_party/imgui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git clone --depth 1 --branch v1.3.4 https://github.com/TsudaKageyu/minhook.git project/third_party/minhook
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path "project/third_party/json" -Force | Out-Null
          Invoke-WebRequest "https://raw.githubusercontent.com/nlohmann/json/v3.11.3/single_include/nlohmann/json.hpp" -OutFile "project/third_party/json/json.hpp"
      - name: Compile original runtime only (no publishing)
        shell: pwsh
        run: |
          cmake -S project -B project/build -A Win32 "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" -DBUILD_TESTING=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build project/build --config Release --target AC4FactionOverhaul --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Original runtime baseline compiled. No package or manifest modified."
